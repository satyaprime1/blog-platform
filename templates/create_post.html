{% extends "base.html" %}

{% block title %}
Create Post
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow">

            <div class="card-body">

                <h2 class="mb-4">
                    Create Blog Post
                </h2>

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Title
                        </label>

                        <input
                            type="text"
                            name="title"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Content
                        </label>

                        <textarea
                            name="content"
                            class="form-control"
                            rows="12"
                            required
                        ></textarea>

                    </div>


                    <button class="btn btn-primary">
                        Publish Post
                    </button>

                    <a
                        href="{{ url_for('post.posts') }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
